<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>مصاريفي</title>
  <meta name="theme-color" content="#2b4c7e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="مصاريفي">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>مصاريفي</h1>
    <p class="month-label">مجموع <span id="month-name"></span></p>
    <p class="month-total" id="month-total">0 د.ع</p>
  </header>

  <main class="container">
    <!-- مجموع كل تصنيف -->
    <section class="card">
      <h2>حسب التصنيف (الشهر الحالي)</h2>
      <ul id="category-totals" class="totals"></ul>
    </section>

    <!-- قائمة المصاريف -->
    <section class="card">
      <h2>المصاريف</h2>
      <p id="empty-message" class="empty">لا توجد مصاريف بعد.<br>اضغط زر <strong>+</strong> لإضافة أول مصروف.</p>
      <ul id="expense-list" class="expense-list"></ul>
    </section>
  </main>

  <!-- زر الإضافة العائم -->
  <button type="button" id="add-btn" class="fab" aria-label="إضافة مصروف">+</button>

  <!-- نافذة إضافة مصروف -->
  <dialog id="expense-dialog" class="sheet">
    <form id="expense-form">
      <div class="sheet-header">
        <h2>إضافة مصروف</h2>
        <button type="button" id="close-btn" class="icon-btn" aria-label="إغلاق">✕</button>
      </div>

      <label>
        المبلغ (دينار عراقي)
        <input type="text" id="amount" inputmode="numeric" autocomplete="off" required placeholder="مثال: 25,000">
      </label>
      <label>
        التصنيف
        <select id="category" required>
          <option value="طعام">طعام</option>
          <option value="مواصلات">مواصلات</option>
          <option value="سكن">سكن</option>
          <option value="فواتير">فواتير</option>
          <option value="صحة">صحة</option>
          <option value="ترفيه">ترفيه</option>
          <option value="تسوق">تسوق</option>
          <option value="أخرى">أخرى</option>
        </select>
      </label>
      <label>
        التاريخ
        <input type="date" id="date" required>
      </label>
      <label>
        ملاحظة
        <input type="text" id="note" maxlength="200" placeholder="اختياري">
      </label>
      <button type="submit" class="primary-btn">حفظ</button>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
