<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متتبع المصاريف</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>متتبع المصاريف</h1>

    <!-- نموذج إضافة مصروف -->
    <section class="card">
      <h2>إضافة مصروف</h2>
      <form id="expense-form">
        <label>
          المبلغ
          <input type="number" id="amount" min="0.01" step="0.01" required placeholder="مثال: 25.50">
        </label>
        <label>
          التصنيف
          <select id="category" required>
            <option value="طعام">طعام</option>
            <option value="مواصلات">مواصلات</option>
            <option value="سكن">سكن</option>
            <option value="فواتير">فواتير</option>
            <option value="صحة">صحة</option>
            <option value="ترفيه">ترفيه</option>
            <option value="تسوق">تسوق</option>
            <option value="أخرى">أخرى</option>
          </select>
        </label>
        <label>
          التاريخ
          <input type="date" id="date" required>
        </label>
        <label class="full">
          ملاحظة
          <input type="text" id="note" maxlength="200" placeholder="اختياري">
        </label>
        <button type="submit" class="full">إضافة</button>
      </form>
    </section>

    <!-- الملخص -->
    <section class="card">
      <h2>الملخص</h2>
      <p class="month-total">
        مجموع <span id="month-name"></span>:
        <strong id="month-total">0.00</strong>
      </p>
      <h3>مجموع كل تصنيف (الشهر الحالي)</h3>
      <ul id="category-totals" class="totals"></ul>
    </section>

    <!-- قائمة المصاريف -->
    <section class="card">
      <h2>قائمة المصاريف</h2>
      <p id="empty-message" class="empty">لا توجد مصاريف بعد.</p>
      <table id="expense-table">
        <thead>
          <tr>
            <th>التاريخ</th>
            <th>التصنيف</th>
            <th>المبلغ</th>
            <th>ملاحظة</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="expense-list"></tbody>
      </table>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
